upstream clover_backend {
    server backend:4000;
}

upstream clover_frontend {
    server frontend:3000;
}

server {
    listen 80;
    server_name _;

    # Forward API requests to the backend
    location /api/ {
        proxy_pass         http://clover_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Forward all other requests to the Next.js frontend
    location / {
        proxy_pass         http://clover_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Required for Next.js WebSocket (dev HMR) – harmless in production
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 120s;
    }
}
